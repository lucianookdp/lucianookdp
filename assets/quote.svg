<svg xmlns="http://www.w3.org/2000/svg" width="520" height="128" viewBox="0 0 520 128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="519" height="127" rx="12" fill="#0d1117" stroke="#22272e" />
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .label { font-size: 12.5px; fill: #8b949e; }
    .value { font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
    .quote { font-size: 14px; font-weight: 400; fill: #e6edf3; }
  </style>
  <text x="22" y="30" class="title">Quote of the day</text>
  <text x="22" y="58" class="quote">Life is pretty simple: you do some stuff. Most fails. Some</text>
  <text x="22" y="80" class="quote">works. You do more of what works.</text>
  <text x="22" y="110" class="label">Leonardo da Vinci</text>
  <text x="498" y="110" class="label" text-anchor="end">day 312 of 365</text>
</svg>