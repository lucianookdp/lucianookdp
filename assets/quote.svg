<svg xmlns="http://www.w3.org/2000/svg" width="730" height="140" viewBox="0 0 730 140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="729" height="139" rx="12" fill="#0d1117" stroke="#22272e" />
  <style>
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #6e7681; }
    .label { font-size: 12.5px; fill: #8b949e; }
    .value { font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
    .metric { font-size: 22px; font-weight: 600; fill: #e6edf3; }
    .quote { font-size: 14px; font-weight: 400; fill: #e6edf3; }
    .rule { stroke: #1b2026; stroke-width: 1; }
  </style>
  <text x="22" y="30" class="eyebrow">QUOTE OF THE DAY</text>
  <text x="22" y="62" class="quote">This is the process by which the mind achieves knowledge of the eternal, unchanging</text>
  <text x="22" y="86" class="quote">Forms.</text>
  <text x="22" y="120" class="label">Plato</text>
  <text x="708" y="120" class="label" text-anchor="end">day 262 of 365</text>
</svg>