<svg xmlns="http://www.w3.org/2000/svg" width="355" height="163" viewBox="0 0 355 163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="354" height="162" rx="12" fill="#0d1117" stroke="#22272e" />
  <style>
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #6e7681; }
