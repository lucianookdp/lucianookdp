<svg xmlns="http://www.w3.org/2000/svg" width="730" height="116" viewBox="0 0 730 116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="729" height="115" rx="12" fill="#0d1117" stroke="#22272e" />
  <style>
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #6e7681; }
    .label { font-size: 12.5px; fill: #8b949e; }
    .value { font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
